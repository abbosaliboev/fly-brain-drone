name: Windows FlyVis smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "requirements*.txt"
      - ".github/workflows/windows-smoke.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "requirements*.txt"
      - ".github/workflows/windows-smoke.yml"

permissions:
  contents: read

jobs:
  clean-setup-smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-flyvis.txt
      - name: Install and validate from scratch
        shell: pwsh
        run: .\scripts\clean_setup_smoke.ps1 -PythonCommand python
